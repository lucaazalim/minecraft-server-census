# Fly.io configuration for Minecraft Server Census.
#
# One machine, one volume, never auto-stopped: the process must run continuously for the whole study.
# Deploy with `fly deploy --ha=false` (see README) so Fly does not create a second machine + volume.

app = "mc-server-census"        # change if the name is taken: fly apps create <name>
primary_region = "gru"          # São Paulo: Brazilian servers see a Brazilian source IP and realistic latency
kill_timeout = "30s"            # gives the sweep time to flush in-flight pings on redeploy

[build]
  dockerfile = "Dockerfile"

# Everything else keeps the defaults from src/server/config.ts (see the README table); only the volume path differs.
[env]
  DATA_DIR = "/data"

[[mounts]]
  source = "mcdata"
  destination = "/data"
  initial_size = "10gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[deploy]
  strategy = "immediate"
