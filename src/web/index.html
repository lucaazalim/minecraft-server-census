<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Live census of public Minecraft Java Edition servers: players online, versions, software and de-duplicated server counts." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Minecraft Server Census</title>
    <script>
      // Apply the stored/system theme before the first paint so there is no flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
